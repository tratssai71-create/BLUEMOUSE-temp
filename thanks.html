<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFEFB" />
  <title>送信完了 | BLUE MOUSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Zen Maru Gothic", sans-serif; background: #FFFEFB; color: #33251a; line-height: 1.75; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    :root { --coral:#f2906c; --teal-light:#e8f6f7; --coral-light:#fdf0eb; --ink:#33251a; }

    .header { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:0 32px; height:60px; background: transparent; backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,0,0,.05); }
    .header__logo img { height:32px; width:auto; }

    .thanks { flex:1; display:flex; align-items:center; justify-content:center; padding:80px 32px; }
    .thanks__card { max-width:520px; text-align:center; background:linear-gradient(135deg, var(--teal-light) 0%, var(--coral-light) 100%); border-radius:28px; padding:56px 40px; }
    .thanks__title { font-size:clamp(1.4rem,3vw,1.8rem); font-weight:700; color:var(--ink); margin-bottom:12px; }
    .thanks__body { font-size:14px; color:#6b5a4c; line-height:1.9; margin-bottom:28px; }
    .thanks__btn { display:inline-flex; align-items:center; gap:6px; padding:12px 32px; background:var(--coral); color:#fff; font-size:14px; font-weight:600; border-radius:100px; transition:transform .2s, box-shadow .2s; }
    .thanks__btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(242,144,108,.3); }

    .pg-footer { text-align:center; padding:24px 16px; font-size:11px; color:#bbb; border-top:1px solid rgba(0,0,0,.05); }

    @media (max-width:780px) {
      .thanks { padding:80px 16px; }
      .thanks__card { padding:40px 24px; border-radius:20px; }
    }
  </style>
</head>
<body>

<!-- ===== Loading ===== -->
<style>
  .bm-loading, .bm-loading body { overflow: hidden; }
  .bm-loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #FFFEFB;
    transition: opacity .8s cubic-bezier(.22,1,.36,1), visibility .8s;
  }
  .bm-loader.is-done { opacity: 0; visibility: hidden; }
  .bm-loader__inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .bm-loader__logo {
    width: min(220px, 54vw); height: auto;
    opacity: 0; transform: translateY(8px) scale(.97); filter: blur(7px);
    animation: bmLogoIn 1.15s cubic-bezier(.22,1,.36,1) .08s forwards;
  }
  .bm-loader__rule {
    position: relative; width: min(220px, 54vw); height: 1px;
    background: rgba(51,37,26,.09); overflow: hidden;
  }
  .bm-loader__rule::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, #f5d24a 0%, #f2906c 50%, #5fc1c7 100%);
    transform: scaleX(0); transform-origin: left center;
    animation: bmRuleIn 1.25s cubic-bezier(.65,0,.35,1) .3s forwards;
  }
  @keyframes bmLogoIn { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes bmRuleIn { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) {
    .bm-loader__logo, .bm-loader__rule::after { animation: none; opacity: 1; transform: none; filter: none; }
  }
</style>
<div class="bm-loader" id="bmLoader" aria-hidden="true">
  <div class="bm-loader__inner">
    <img src="./logo.png" alt="" class="bm-loader__logo" />
    <span class="bm-loader__rule"></span>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('bmLoader');
  if (!el) return;
  var root = document.documentElement;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // サイト内リンクでの遷移・ブラウザの戻る/進むでは出さない。
  // 直接訪問・外部からの流入・リロードなど「読み込み」のときは初回に限らず毎回出す。
  var navType = '';
  try {
    var navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (navEntry) navType = navEntry.type;
  } catch (e) {}
  var fromSameSite = false;
  try {
    fromSameSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (e) {}
  var isInternalNav = (fromSameSite && navType !== 'reload') || navType === 'back_forward';

  if (reduce || isInternalNav) {
    if (el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  root.classList.add('bm-loading');

  var removed = false;
  function done() {
    if (removed) return;
    removed = true;
    el.classList.add('is-done');
    root.classList.remove('bm-loading');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  }
  var start = Date.now(), MIN = 1500;
  function finish() { setTimeout(done, Math.max(0, MIN - (Date.now() - start))); }
  if (document.readyState === 'complete') finish();
  else window.addEventListener('load', finish);
  setTimeout(done, 4500); // 画像等が失敗しても必ず解除する保険
})();
</script>

<header class="header">
  <a href="./index.html" class="header__logo"><img src="./logo.png" alt="BLUE MOUSE" /></a>
</header>

<div class="thanks">
  <div class="thanks__card">

    <a href="./index.html" class="thanks__btn">トップに戻る ›</a>

</div>

<script>
  if (new URLSearchParams(window.location.search).get('type') === 'screening') {
    document.getElementById('thanks-body').innerHTML = '内容を確認のうえ、体験のご案内可否も含めて<br>2〜3営業日以内に<br>担当者よりご連絡いたします。';
  }
</script>

<div class="pg-footer">© BLUE MOUSE All Rights Reserved.</div>

<style>
  @keyframes ctaPulse {
    0%   { transform: scale(.92); opacity: .55; }
    100% { transform: scale(1.28); opacity: 0; }
  }
  .floating-cta {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 150;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--coral), #e8785a);
    color: #fff;
    font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(242,144,108,.45);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .floating-cta::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--coral);
    animation: ctaPulse 2.4s ease-out infinite;
    pointer-events: none;
  }
  .floating-cta__icon {
    width: 16px; height: 16px;
    margin-top: 3px;
  }
  .floating-cta__main { font-size: 14px; font-weight: 700; letter-spacing: .03em; line-height: 1.15; }
  .floating-cta__sub { font-size: 11px; font-weight: 600; letter-spacing: .01em; opacity: .95; line-height: 1.2; }
  .floating-cta:hover { transform: translateY(-4px) scale(1.06); box-shadow: 0 14px 34px rgba(242,144,108,.55); }
  @media (max-width: 780px) {
    .floating-cta { bottom: 16px; right: 16px; width: 78px; height: 78px; }
    .floating-cta__icon { width: 13px; height: 13px; }
    .floating-cta__main { font-size: 12px; }
    .floating-cta__sub { font-size: 9.5px; }
  }
</style>
<a href="./contact.html" class="floating-cta">
  <span class="floating-cta__main">体験</span>
  <span class="floating-cta__sub">お問い合わせ</span>
  <svg class="floating-cta__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</a>
</body>
</html>
